# Two-node NCCL fabric test for GKE A3 Ultra / A4 (multi-networking + gIB path).
#
# Vendored from GoogleCloudPlatform/container-engine-accelerators
# gpudirect-rdma/nccl-test-a4.yaml (Apache 2.0, Copyright Google Inc.), with:
#   * the duplicate container `resources:` key merged into one block,
#   * names/labels prefixed llmd- to avoid collisions with user workloads.
# Upstream reference:
# https://github.com/GoogleCloudPlatform/container-engine-accelerators/tree/master/gpudirect-rdma
#
# NCCL env comes from sourcing /usr/local/gib/scripts/set_nccl_env.sh inside the
# image; per Google's guidance, do not hand-set NCCL_* variables on top of it.
apiVersion: v1
kind: Service
metadata:
  name: llmd-nccl-host-1
spec:
  selector:
    name: llmd-nccl-host-1
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: llmd-nccl-host-2
spec:
  selector:
    name: llmd-nccl-host-2
  clusterIP: None
---
apiVersion: v1
kind: Pod
metadata:
  name: llmd-nccl-test-host-1
  labels:
    name: llmd-nccl-host-1
    app: llmd-conformance-nccl
  annotations:
    networking.gke.io/default-interface: 'eth0'
    networking.gke.io/interfaces: |
      [
        {"interfaceName":"eth0","network":"default"},
        {"interfaceName":"eth2","network":"rdma-0"},
        {"interfaceName":"eth3","network":"rdma-1"},
        {"interfaceName":"eth4","network":"rdma-2"},
        {"interfaceName":"eth5","network":"rdma-3"},
        {"interfaceName":"eth6","network":"rdma-4"},
        {"interfaceName":"eth7","network":"rdma-5"},
        {"interfaceName":"eth8","network":"rdma-6"},
        {"interfaceName":"eth9","network":"rdma-7"}
      ]
spec:
  hostNetwork: false
  hostPID: false
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: llmd-conformance-nccl
        topologyKey: kubernetes.io/hostname
  volumes:
    - name: library-dir-host
      hostPath:
        path: /home/kubernetes/bin/nvidia
    - name: gib
      hostPath:
        path: /home/kubernetes/bin/gib
    - name: shared-memory
      emptyDir:
        medium: "Memory"
        sizeLimit: 250Gi
  containers:
    - image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib-diagnostic:v1.1.1
      name: test
      volumeMounts:
        - name: library-dir-host
          mountPath: /usr/local/nvidia
        - name: gib
          mountPath: /usr/local/gib
        - name: shared-memory
          mountPath: /dev/shm
      env:
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib64
      resources:
        requests:
          cpu: 150m
        limits:
          nvidia.com/gpu: 8
      command: ["/bin/bash", "-c"]
      args:
        - |
          /scripts/container_entry.sh shell
          source /usr/local/gib/scripts/set_nccl_env.sh
          sleep infinity
---
apiVersion: v1
kind: Pod
metadata:
  name: llmd-nccl-test-host-2
  labels:
    name: llmd-nccl-host-2
    app: llmd-conformance-nccl
  annotations:
    networking.gke.io/default-interface: 'eth0'
    networking.gke.io/interfaces: |
      [
        {"interfaceName":"eth0","network":"default"},
        {"interfaceName":"eth2","network":"rdma-0"},
        {"interfaceName":"eth3","network":"rdma-1"},
        {"interfaceName":"eth4","network":"rdma-2"},
        {"interfaceName":"eth5","network":"rdma-3"},
        {"interfaceName":"eth6","network":"rdma-4"},
        {"interfaceName":"eth7","network":"rdma-5"},
        {"interfaceName":"eth8","network":"rdma-6"},
        {"interfaceName":"eth9","network":"rdma-7"}
      ]
spec:
  hostNetwork: false
  hostPID: false
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
